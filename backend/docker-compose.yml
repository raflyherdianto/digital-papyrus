version: '3.8'

services:
  backend:
    image: ghcr.io/raflyherdianto/digital-papyrus-backend:latest
    container_name: be-papyrus
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    networks:
      - shared-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - ../uploads:/app/frontend/public/uploads

networks:
  shared-network:
    name: shared-network
    external: true